# Hallazgos numerados de la campaña. Cada uno con nivel de confianza y de qué evidencia sale.
# confidence: alta | media | hipótesis
findings:
  - id: 1
    title: "Las cuentas TikTok de reclutamiento han desaparecido"
    confidence: alta
    date: 2026-08-29
    text: >
      Las dos cuentas de reclutamiento citadas por El Español y Golden Owl (@haragaa_ceuta1,
      @haragaceuta24) ya no resuelven en TikTok: retiradas o renombradas tras la crisis. La capa de
      reclutamiento se ha borrado de TikTok; solo queda en Facebook/WhatsApp y en lo que archivaron
      terceros. Capturar pronto lo del 23-sep es urgente.
    evidence: "Intento de captación 29-ago (yt-dlp: 'Unable to extract secondary user ID'); registros en runs."
  - id: 2
    title: "La capa de medios no muestra coordinación: es cobertura, no movilización"
    confidence: alta
    date: 2026-08-29
    text: >
      Con 400+ publicaciones de YouTube y TikTok (medios regionales marroquíes y españoles) no aparecen
      ráfagas, duplicados entre cuentas ni grafo de amplificación. Coincide con Madrigal: el 11 % de
      cuentas (medios) concentra el 70 % del alcance. Las respuestas a origen y coordinación están en
      Telegram y en los grupos de Facebook, no aquí.
    evidence: "faro analyze bursts/dupes/graph sobre el corpus limpio; informe.md §3-4."
  - id: 3
    title: "Las fechas convocadas coinciden con hitos políticos marroquíes"
    confidence: hipótesis
    date: 2026-08-29
    text: >
      El 30-jul-2026 fue la víspera de la Fiesta del Trono y el 23-sep-2026 es la jornada de
      elecciones legislativas en Marruecos. Las dos convocatorias caen en fechas de máxima carga
      simbólica y policial para Rabat. Apunta a un actor interesado en dañar al Estado marroquí, no
      solo en mover migrantes; coherente con los marcadores argelinos de Golden Owl. No es prueba: es
      lo que hay que testar. Implicación de método: cruzar siempre "23 شتنبر" con términos de Ceuta.
    evidence: "Corpus YouTube 21-28 ago (podcasts y medios marroquíes sobre 'معركة 23 شتنبر'); Golden Owl."
  - id: 4
    title: "La incitación cambia de objetivo por tramos"
    confidence: media
    date: 2026-08-29
    text: >
      Julio: logística ("cómo cruzar"). 30-31 jul: prueba social en directo. Agosto: recordatorio de
      fecha ("15/8, última oportunidad"). Desde el 24-ago ya no es "vamos a Ceuta" sino "Ceuta contra
      los que llegaron" y "el Estado abandona Ceuta", en español y con cientos de miles de vistas.
      Ambos discursos alimentan el 23-sep desde lados opuestos.
    evidence: "timeline.yml (7 tramos) sobre el corpus y las fuentes de terceros."
  - id: 5
    title: "En Tor, la única presencia relevante es la ultraderecha francesa"
    confidence: alta
    date: 2026-08-29
    text: >
      Primera pasada por 16 buscadores .onion (231 resultados, 11 relevantes): nada de movilización ni
      de paso de personas; sí dos espejos Tor de Démocratie Participative (sitio ultra prohibido en
      Francia) explotando Ceuta en clave racial, con bulos ("Sánchez decreta 500 chicas de Ceuta…") y
      un enviado propio. La crisis ya es material de propaganda para terceros ajenos a Marruecos y España.
    evidence: "Capturas .onion con hash (2 páginas ingeridas); campaigns/ceuta-2026/entities.yml."
  - id: 6
    title: "La convocatoria del 23-sep existió y no se materializó"
    confidence: alta
    date: 2026-10-01
    text: >
      Hubo llamamientos reales en grupos de WhatsApp y redes sociales para el 23 de septiembre, con
      instrucciones de difundirlos en otras plataformas. España reforzó la frontera desde el 22 (75
      agentes de UIP y pelotones del GRS) y Marruecos desplegó en Fnideq. El día pasó con normalidad:
      solo los acercamientos habituales de pequeños grupos a los montes. Es la tercera convocatoria
      del ciclo: el 30-jul funcionó, el 15-ago y el 23-sep fracasaron.
    evidence: "Medi24 (22-sep), EFE vía Infobae (22 y 23-sep), Almarrakchia (23-sep)."
  - id: 7
    title: "El código rotatorio volvió como «الهجمة الكبرى»"
    confidence: alta
    date: 2026-10-01
    text: >
      La prensa marroquí recoge que los grupos de WhatsApp promovían «الهجمة الكبرى» (la gran
      ofensiva). Es el segundo término de la rotación كرياج → الهجمة → الرياح documentada por Golden
      Owl, que el léxico v0.2 ya incluía desde el 28-ago. La rotación no avanzó a الرياح: volvió a un
      término ya quemado y lo amplió con «الكبرى». El léxico habría servido para detectar la
      convocatoria si la captación hubiera llegado a WhatsApp.
    evidence: "Medi24 (22-sep); léxico de campaign.yml; entities.yml (term:hijma)."
  - id: 8
    title: "Quien difundía estaba repartido por todo Marruecos, no en Fnideq"
    confidence: media
    date: 2026-10-01
    text: >
      El 23-sep la DGSN anunció 10 detenidos (dos de 16 y 17 años) por difundir contenidos que
      incitaban a la entrada colectiva en Ceuta y Melilla, en coordinación con la DGST. Las
      detenciones fueron en Temara, Beni Mellal, Casablanca, Taza, Marrakech, Fez, Taroudant y Nador:
      solo Nador está en la frontera. La capa de difusión era nacional y dispersa, y entre los
      difusores había menores. Queda sin responder si había una cabecera común. El comunicado lo
      emite una de las partes y no nombra plataformas ni actor extranjero.
    evidence: "Comunicado DGSN vía Chamalpress (23-sep); EFE vía El Faro de Ceuta (23-sep)."
  - id: 9
    title: "La hipótesis de las fechas sale reforzada, pero sigue sin probar"
    confidence: hipótesis
    date: 2026-10-01
    text: >
      La convocatoria cayó exactamente en la jornada electoral, como se anticipó el 29-ago (hallazgo
      3). Esto refuerza que la fecha se eligió por su carga para Rabat. No prueba quién la eligió: los
      detenidos son difusores locales, y ninguna fuente pública de septiembre atribuye la operación
      a un actor extranjero. Los marcadores argelinos de Golden Owl siguen siendo la única pista y no
      se han podido contrastar.
    evidence: "Hallazgo 3; detenciones del hallazgo 8; Wikipedia «Crisis migratoria de Ceuta de 2026»."
  - id: 10
    title: "La capa decisiva volvió a quedar fuera de la captación"
    confidence: alta
    date: 2026-10-01
    text: >
      La convocatoria del 23-sep circuló por WhatsApp y Facebook, igual que la del 30-jul. Faro no
      tiene acceso programático a ninguna de las dos y la cuenta de Telegram nunca llegó a operar. El
      corpus de YouTube y TikTok confirma la conversación pública alrededor de la fecha, pero no puede
      responder a quién convoca ni cómo se coordina. Es la limitación principal del trabajo, y el
      requisito de cualquier campaña futura: acceso a la capa cerrada o colaboración con quien lo
      tiene.
    evidence: "faro status (corpus); rounds.log (telegram: sin credenciales)."
  - id: 11
    title: "En abierto, el 23-S lo difundió sobre todo el alarmismo en español"
    confidence: media
    date: 2026-10-01
    text: >
      Entre el 10 y el 23 de septiembre, el corpus tiene 16 vídeos en español de 12 canales que
      anuncian el 23 como fecha de "invasión", "asalto" o "salto masivo" (unas 255.000 vistas). En
      árabe hay 4 vídeos con unas 2.400 vistas, y encuadran el 23 como un "plan" atribuido a Argelia
      («الكابرانات»), no como un llamamiento. Las tres cuentas de medios marroquíes de TikTok
      publicaron 22 piezas del 20 al 24 y ninguna menciona Ceuta: cubren las elecciones. La
      convocatoria real circulaba cerrada, por WhatsApp. En la capa pública, su principal altavoz
      fue el miedo del lado español. Matiz: el corpus sale de consultas de YouTube en los dos idiomas
      y de tres cuentas de TikTok; no es una muestra de toda la plataforma.
    evidence: "Consulta SQL sobre posts 10-23 sep (filtro '23' + términos de asalto; se excluye una tertulia que es falso positivo); TikTok 20-24 sep."
  - id: 12
    title: "Ninguna señal de coordinación en el corpus público, tampoco en septiembre"
    confidence: alta
    date: 2026-10-01
    text: >
      Con el corpus ampliado a 969 publicaciones (549 de YouTube, 418 de TikTok, 2 de .onion) hasta el
      1-oct, sigue sin haber ráfagas de texto ni de URL, y los duplicados que aparecen son ruido. Es
      el mismo resultado que el 29-ago: la capa pública es cobertura y opinión, no movilización.
    evidence: "faro analyze bursts --kind text/url y faro analyze dupes, 1-oct; 464/464 evidencias verifican."
