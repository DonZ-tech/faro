  - {date: 2026-07-27, label: "Primer enlace público a grupo de WhatsApp de logística", kind: coordination, source: maldita}
  - {date: 2026-07-28, label: "Primera mención de '15/8' como fecha de la siguiente convocatoria", kind: incitement, source: madrigal}
  - {date: 2026-07-29, label: "UMCPS (Telegram) encuadra la entrada como 'referéndum' (21:08 UTC); Marruecos cierra playas de Fnideq", kind: narrative, source: madrigal}
  - {date: 2026-07-30, label: "Entrada masiva: ~72.000 personas en 48 h. Víspera de la Fiesta del Trono. Pico TikTok 20-21 h (748 posts)", kind: event, source: "corpus + madrigal"}
  - {date: 2026-07-31, label: "141 muertos (78 ES / 63 MA). Retorno masivo. Sánchez: 'violación de la integridad territorial'", kind: event, source: prensa}
