# Línea temporal de la campaña. Hitos = hechos fechados con fuente. Tramos = lectura analítica de
# qué se está incitando, con la evidencia de la que sale (corpus propio o informe de terceros).
# Los volúmenes por día los calcula faro desde la base de datos; aquí solo va el juicio.
milestones:
