  - {date: 2026-08-02, label: "Último enlace WhatsApp del corpus de Maldita: 'para el día 15'", kind: coordination, source: maldita}
  - {date: 2026-08-10, label: "Informe Golden Owl: 'operación organizada, preconstruida y publicitada'", kind: analysis, source: golden-owl}
  - {date: 2026-08-11, label: "UE, Meta y TikTok acuerdan canal rápido de verificación ante el 15-ago", kind: response, source: prensa}
