  - {date: 2026-07-17, label: "Arrancan los llamamientos de reclutamiento directo en grupos de Facebook", kind: incitement, source: golden-owl}
  - {date: 2026-07-21, label: "Primer reclutamiento directo documentado por Maldita", kind: incitement, source: maldita}
  - {date: 2026-07-25, label: "Circulan mapas con rutas a nado", kind: incitement, source: elespanol}
