  - {date: 2026-09-22, label: "Grupos de WhatsApp promueven «الهجمة الكبرى» para el 23. España refuerza la frontera (75 UIP + GRS); alerta en Fnideq", kind: incitement, source: "medi24 + EFE"}
  - {date: 2026-09-23, label: "Jornada electoral en Marruecos. La entrada no se produce. La DGSN detiene a 10 difusores (2 menores) en 8 ciudades", kind: event, source: "EFE + DGSN"}
tramos:
  - from: 2026-07-01
    to: 2026-07-20
    title: "Preparación en silencio"
    incitement: >
      Nada visible en medios (0 publicaciones relevantes en el corpus). La actividad está en la capa
      cerrada: grupos de Facebook creados entre 2014 y marzo de 2025, identidades operativas
      (correo, Instagram, TikTok) registradas en septiembre de 2025, y desde el 17 de julio
      llamamientos directos a "asaltar la valla" con perfiles concretos de reclutamiento. La sentencia
      del Supremo del 8 de julio se reinterpreta como "la frontera se ha abierto".
    signals: ["reclutamiento directo en grupos cerrados", "reinterpretación de la sentencia del TS", "infraestructura preparada 10 meses antes"]
    sources: [golden-owl, maldita]
  - from: 2026-07-21
    to: 2026-07-29
    title: "Escalada logística"
    incitement: >
      Se pasa del "cuándo" al "cómo": mapas de rutas a nado, búsqueda de kayaks, aletas, flotadores
      y ganchos para la valla (un usuario repite 25 veces el mismo anuncio), enlaces a grupos de
      WhatsApp con horarios, puntos de concentración y "preparación física y psicológica". Aparece el
      código كرياج (kariaj, "el garaje" = la ruta) y el 28-jul ya se siembra la fecha siguiente (15/8).
      El corpus de medios solo recoge el efecto: presión nocturna, CETI lleno y, el 29, "استنفار أمني
      بالفنيدق لمواجهة دعوات الهجرة" (despliegue en Fnideq frente a los llamamientos).
    signals: ["logística pública", "enlaces WhatsApp avalados por varias cuentas", "código rotatorio كرياج", "siembra anticipada del 15/8"]
    sources: [corpus, maldita, madrigal, golden-owl, elespanol]
  - from: 2026-07-30
    to: 2026-07-31
    title: "El evento y su retransmisión"
    incitement: >
      Incitación en directo: "مباشرة من داخل سبتة" (en directo desde dentro de Ceuta), miles de
      vídeos de gente cruzando que funcionan como prueba de que "se puede". 748 publicaciones en
      TikTok el 30 (75 % del dataset anual), pico 20-21 h; en X una cuenta emite 74 tuits idénticos en
      ráfagas de 9-15 s; 9 cuentas republican la misma descripción. El encuadre en árabe es "طوفان"
      (diluvio) y "الهروب الكبير" (la gran huida), con "سبتة المحتلة" (Ceuta ocupada) como marcador
      político. Ya el 30 aparece la contranarrativa: testimonios de retornados ("mejor quedarse en tu
      sitio").
    signals: ["directos y prueba social", "ráfagas automatizadas en X", "subtítulos idénticos en TikTok", "encuadre 'ocupada'"]
    sources: [corpus, madrigal]
  - from: 2026-08-01
    to: 2026-08-07
    title: "Resaca y re-convocatoria"
    incitement: >
      Dos discursos opuestos. El dominante en medios es la desmovilización: hambre, sueño en la
      calle, retorno a Marruecos, muertos, testimonios de "no merece la pena". Pero el 1 de agosto,
      en el grupo de 108.000 miembros, se publica "el día 15 va a pasar algo en Fnideq" y el 2 se
      comparte el último enlace WhatsApp "para el día 15". Aparecen los lemas "es nuestra última
      oportunidad" y "Hermanos, 15/08/2026, Castillejos-Ceuta". La política española (Schengen,
      Meloni) entra en el ruido y reaparece "سبتة_المحتلة" como hashtag.
    signals: ["fecha fija + 'última oportunidad'", "enlace en primer comentario", "contranarrativa orgánica de retornados"]
    sources: [corpus, golden-owl, maldita, elindependiente]
  - from: 2026-08-08
    to: 2026-08-15
    title: "Segunda convocatoria: recordatorio y blindaje"
    incitement: >
      La incitación se reduce a recordar la cita: "al atardecer y al amanecer del día 15 todo el
      mundo entra". Marruecos responde con un despliegue visible (drones, cañones de agua, cordón
      terrestre y marítimo) que los medios marroquíes amplifican, y eso funciona a la vez como
      disuasión y como confirmación de que la fecha es real. El 15 un vídeo titula "بداية الهجرة
      الجماعية الثانية اليوم" (empieza hoy la segunda migración colectiva) y acaba con ~30
      interceptados. El fracaso no cierra el ciclo: ese mismo día VerificaRTVE ve mensajes hacia el
      23 de septiembre.
    signals: ["recordatorio de fecha", "amplificación del despliegue", "convocatoria fallida", "siembra del 23-sep"]
    sources: [corpus, prensa, VerificaRTVE]
  - from: 2026-08-16
    to: 2026-08-23
    title: "Politización y desplazamiento del foco"
    incitement: >
      Cae la incitación directa (18 publicaciones relevantes) y sube la lectura política: en Marruecos
      el debate se engancha a las elecciones del 23 de septiembre ("¿qué sentido tienen las
      elecciones tras Ceuta?", "la monarquía en primera línea, ¿dónde está el gobierno?"); en España
      la reivindicación marroquí de Ceuta y el papel del Rey. Es el tramo en que "23 شتنبر" empieza a
      circular con dos sentidos a la vez: jornada electoral y fecha de convocatoria. Traslados del
      Trampolín a los campamentos.
    signals: ["encuadre electoral", "23-sep con doble sentido", "soberanía como tema"]
    sources: [corpus, prensa]
  - from: 2026-08-24
    to: 2026-08-31
    title: "Seguridad Nacional y tensión interna"
    incitement: >
      La incitación cambia de objetivo: ya no es "vamos a Ceuta" sino "Ceuta contra los que llegaron"
      y "el Estado contra Ceuta". Vecinos que intentan echar a los migrantes del Trampolín, bloqueo
      de camiones de Cruz Roja, campamentos incendiados, emboscada a militares en Benzú. En español,
      canales de opinión con cientos de miles de vistas ("El Gobierno abandona Ceuta", "¿Soros
      financió la entrada?", "la nueva fecha que preocupa"); en árabe, la miseria de los que quedan
      ("duermen en alcantarillas") y la lectura de fracaso de la élite marroquí. Ambos discursos son
      combustible para el 23-sep: uno prueba que "España está débil", el otro que "no hay futuro allí".
      En Tor, la única presencia relevante es la ultraderecha francesa (Démocratie Participative, dos
      espejos) explotando Ceuta en clave racial con bulos y un enviado propio: la crisis ya es
      material de propaganda para terceros ajenos a Marruecos y España.
    signals: ["violencia local", "conspiración", "anuncio de nueva fecha", "narrativa de Estado ausente", "ultraderecha extranjera en Tor"]
    sources: [corpus, prensa, onion]
  - from: 2026-09-01
    to: 2026-09-30
    title: "Tercera convocatoria y cierre del ciclo"
    incitement: >
      El 23-sep circula con dos sentidos durante todo el mes: elecciones y fecha de entrada. En los
      últimos días, los grupos de WhatsApp vuelven al código «الهجمة», ahora «الكبرى», y piden
      difundirlo en otras plataformas. El despliegue preventivo de los dos lados se hace público
      antes de la fecha y, como el 15-ago, funciona a la vez como disuasión y como confirmación. El
      día pasa sin incidentes. Marruecos cierra el ciclo con detenciones repartidas por todo el país,
      y a 1-oct no consta en prensa una cuarta fecha, a diferencia de lo que pasó tras el 15-ago.
    signals: ["código rotatorio reciclado", "despliegue preventivo anunciado", "convocatoria fallida", "detenciones de difusores en todo el país"]
    sources: [corpus, prensa, medi24, DGSN]
