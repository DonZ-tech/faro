[project]
name = "faro"
version = "0.2.0"
description = "OSINT con cadena de custodia: operaciones de influencia en redes y filtraciones de datos. Captación con evidencia SHA-256, seudonimización, detección de coordinación e importación de SpiderFoot. Don Z."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "telethon>=1.36",
  "yt-dlp>=2025.1.1",
  "httpx[socks]>=0.27",
  "beautifulsoup4>=4.12",
  "pysocks>=1.7",
  "networkx>=3.3",
  "python-louvain>=0.16",
  "datasketch>=1.6",
  "imagehash>=4.3",
  "pillow>=10.4",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
faro = "faro.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faro"]

[tool.hatch.build]
include = ["faro/**/*.py", "faro/**/*.html"]
